# Publishes catalisa-biometrics to RubyGems with trusted publishing: the workflow
# proves who it is through GitHub's OIDC token, so there is no API key to store,
# rotate or leak. The pending publisher on rubygems.org names this repository and
# this file — renaming either one breaks the trust, on purpose.
name: publish-rubygems

on:
  push:
    tags: ["packages/ruby/v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token trusted publishing verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Nothing is published before the suite passes: a yanked gem still occupies
      # its version number forever.
      - name: Test
        run: ruby -Ilib -Itest -e 'Dir.glob("test/*_test.rb").each { |f| require File.expand_path(f) }'

      # The official release-gem action runs `rake release`, which wants a
      # Rakefile and also creates and pushes the git tag — the tag is what
      # triggered this run, so it would fight itself. Exchanging the OIDC token
      # for a short-lived credential and pushing the gem does the same job
      # without a key and without touching git.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build and push
        run: |
          gem build catalisa-biometrics.gemspec
          gem push catalisa-biometrics-*.gem
