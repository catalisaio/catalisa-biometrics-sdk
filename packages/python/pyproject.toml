[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalisa-biometrics"
version = "0.1.0"
description = "Catalisa Biometrics Python SDK — liveness and face-match sessions, signed evidence and webhook verification (standard library only)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Catalisa", email = "contato@catalisa.io" }]
keywords = ["catalisa", "biometrics", "biometria", "liveness", "kyc", "webhook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://docs.catalisa.app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catalisa_biometrics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
